name: keepalive

# GitHub pauses scheduled workflows of a public repository after 60 days
# without activity. Re-enabling an enabled workflow is a no-op that counts as
# activity, so this weekly job keeps both schedules alive even if collecting
# fails for a long time (the daily index commit normally does it already).

on:
  schedule:
    - cron: "30 0 * * 1"  # Monday 09:30 KST
  workflow_dispatch:

permissions: {}

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Re-enable the workflows
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          for workflow in collect.yml keepalive.yml; do
            gh api --method PUT "repos/${REPO}/actions/workflows/${workflow}/enable" --silent \
              && echo "keepalive: ${workflow} re-enabled" \
              || echo "::warning::keepalive: could not re-enable ${workflow}"
          done
